# mako (started at compositor exec-once/spawn-at-startup) already owns
# org.freedesktop.Notifications, so dms.service's own Type=dbus + BusName
# requirement can never be satisfied while mako is running — systemd waits
# the full start timeout, kills it, and restarts it in a loop forever
# (discovered when a manual `systemctl --user restart dms.service` exposed
# it; the original manually-started process had been running fine for
# hours precisely because it was never started *through* systemd's
# Type=dbus activation path in the first place). DMS works fully as a
# shell either way — the only thing actually gated on owning that bus name
# is whether DMS's own notification popups receive freedesktop
# notifications instead of mako. Overriding to Type=simple makes systemd
# consider the unit started as soon as the process launches, matching how
# it behaved before it was ever `systemctl enable`d.
[Service]
Type=simple
