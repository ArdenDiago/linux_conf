[general]
mode = normal
framerate = 15
bars = 8
autosens = 1
sensitivity = 100

[input]
method = pulse
source = auto

[output]
method = raw
channels = mono
mono_option = average
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 7
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
integral = 77
monstercat = 1
waves = 0
gravity = 100
ignore = 0
