# Custom escape sequences sent by Alacritty (see ~/.config/alacritty/alacritty.toml)
# mapped to symbolic tmux keys. This is needed because most terminals can't
# tell Ctrl+Shift+<letter> apart from plain Ctrl+<letter>, so Alacritty sends
# these private sequences instead and tmux translates them here.
set -s user-keys[0] "\e[90~"
set -s user-keys[1] "\e[91~"
set -s user-keys[2] "\e[92~"
set -s user-keys[3] "\e[93~"
set -s user-keys[4] "\e[94~"
set -s user-keys[5] "\e[95~"
set -s user-keys[6] "\e[96~"

# Ctrl+Shift+D: horizontal split (top/bottom panes)
bind-key -n User0 split-window -v
# Ctrl+Alt+D: vertical split (left/right panes)
bind-key -n User1 split-window -h
# Ctrl+Alt+Left/Right/Up/Down: move focus between panes
bind-key -n User2 select-pane -L
bind-key -n User3 select-pane -R
bind-key -n User4 select-pane -U
bind-key -n User5 select-pane -D
# Ctrl+Shift+H: pick one of the last 10 sessions to switch to
bind-key -n User6 choose-tree -Zs

# Every new Alacritty window starts a brand new tmux session (see
# alacritty.toml). Old sessions are kept around, detached, so User6 above can
# switch back to them - but only the most recent 10 are kept (FIFO queue);
# anything older is killed automatically when a new session is created.
set-hook -g session-created 'run-shell "~/.config/tmux/session_limit.sh"'

# Show a welcome banner (name + system specs) once per new terminal window.
set-hook -ag session-created 'send-keys "clear; ~/.config/tmux/welcome.sh" Enter'

# prefix + t: 12-hour clock with AM/PM, day and date shown below.
# Overrides tmux's stock clock-mode, which is 24h-capable but has no AM/PM
# or date, in a popup instead of taking over the pane.
bind-key t display-popup -w 100% -h 100% -E "~/.config/tmux/bigclock.sh"
